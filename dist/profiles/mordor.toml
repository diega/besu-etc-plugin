# Mordor, the Ethereum Classic testnet.
#
# Besu reads profiles from ${besu.home}/profiles (override with -Dbesu.profiles.dir), so install
# this file there and start with --profile=mordor. The plugin jar must be in ${besu.home}/plugins.
#
# The genesis is deliberately not named here. Besu resolves genesis-file against the working
# directory rather than against the profile, so any path written here would only work from one
# place. bin/besu-etc computes it from the installation and passes it as BESU_GENESIS_FILE; running
# bin/besu directly needs --genesis-file. Bootnodes and the DNS discovery tree come from the genesis
# file itself.

network-id=7

# ETC peers speak eth/68; Besu would otherwise offer a higher capability and find no peers.
Xeth-capability-max=68
